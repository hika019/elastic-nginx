apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-init
  namespace: elastic-nginx
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never

      initContainers:
        - name: wait-elasticsearch
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              attempt=0
              until curl -fsS --max-time 5 \
                http://elasticsearch:9200/_cluster/health > /dev/null; do
                attempt=$((attempt + 1))
                [ "$attempt" -lt 60 ] || exit 1
                sleep 5
              done

      containers:
        - name: es-init
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "/config/init.sh"]
          env:
            - name: ES_URL
              value: "http://elasticsearch:9200"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: nginx-elasticsearch-init
