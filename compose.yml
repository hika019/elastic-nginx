services:
  es:
    image: elasticsearch:8.17.0
    ports:
      - 9200:9200
      - 9300:9300
    mem_limit: 1g

    environment:
      - discovery.type=single-node
      - cluster.name=docker-cluster
      - 'ES_JAVA_OPTS=-XX:UseSVE=0'
      - 'CLI_JAVA_OPTS=-XX:UseSVE=0'
      - ELASTIC_PASSWORD=test
      - xpack.security.enabled=false
    
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  es-init:
    image: curlimages/curl:latest
    depends_on:
      es:
        condition: service_healthy
    environment:
      ES_URL: http://es:9200
    volumes:
      - ./elasticsearch-init:/config:ro
    entrypoint:
      - /bin/sh
      - /config/init.sh
    restart: "no"

  kibana:
    image: kibana:8.17.0
    ports:
      - 5601:5601
    environment:
    - ELASTICSEARCH_HOSTS=http://es:9200
    depends_on:
      es-init:
        condition: service_completed_successfully

  kibana-init:
    image: curlimages/curl:latest
    depends_on:
      - kibana
    volumes:
      - ./kibana-init:/config:ro
    entrypoint:
      - /bin/sh
      - /config/init.sh
    restart: "no"


  beats:
    image: elastic/filebeat:8.17.0
    volumes:
      - ./beats/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - ./beats/log:/var/log/work
    depends_on:
      es-init:
        condition: service_completed_successfully
    environment:
      LOGSTASH_HOSTS: http://es:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: test
    command: ["--strict.perms=false"]
