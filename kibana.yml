apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: elastic-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.19.23
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch:9200"
        volumeMounts:
        - name: kibana-storage
          mountPath: /usr/share/kibana/data
      volumes:
      - name: kibana-storage
        persistentVolumeClaim:
          claimName: pvc-kibana
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: elastic-nginx
spec:
  type: NodePort
  selector:
    app: kibana
  ports:
  - port: 5601
    targetPort: 5601
    nodePort: 30561

