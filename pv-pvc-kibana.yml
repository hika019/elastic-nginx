apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-kibana
spec:
  capacity:
    storage: 5Gi
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.20.100
    path: /volume1/k8s_volume/elastic-nginx/kibana
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-kibana
  namespace: elastic-nginx
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  volumeName: pv-kibana

